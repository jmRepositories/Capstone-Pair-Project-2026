<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <div class="logo">CookBook of Tomorrow</div>

        <input type="text" id="nameSearch" placeholder="Search recipe name" />

        <div class="nav-buttons">
          <button class="btn create">
            Make/Add Recipe
          </button>
        </div>
      </header>

      <!-- Hero -->
      <section class="hero">
        <h1>Explore Recipes</h1>
      </section>

      <!-- Filters -->
      <section class="filters">
        <button class="filter active" data-category="all">All</button>
        <button class="filter" data-category="starter">Starters</button>
        <button class="filter" data-category="main">Main Courses</button>
        <button class="filter" data-category="dessert">Desserts</button>
      </section>

      <div class="content">
        <!-- Recipe Grid -->
        <main class="recipes">
          <!-- <div class="card" data-category="starter">
            <img src="images/fresh-salad.jpg" />
            <h3>Fresh Salad</h3>
            <p>Healthy starter recipe</p>
          </div>

          <div class="card" data-category="main">
            <img src="images/salad.jpg" />
            <h3>Pasta Bowl</h3>
            <p>Italian creamy pasta</p>
          </div>

          <div class="card" data-category="dessert">
            <img src="images/sprinkles-donut.jpg" />
            <h3>Sprinkle Donuts</h3>
            <p>Rich dessert</p>
          </div>

          <div class="card" data-category="main">
            <img src="images/pizza-delight.jpg" />
            <h3>Pizza Delight</h3>
            <p>Cheesy classic pizza</p>
          </div> -->
        </main>

        <!-- Sidebar -->
        <aside class="sidebar">
          <label for="caloriesSearch">Max Calories:</label><br />
          <input
            type="number"
            id="caloriesSearch"
            placeholder="Max calories"
          /><br /><br />
          <label for="cuisine">Cuisine:</label><br />
          <select id="cuisine">
            <option value="">All Cuisines</option>
            <option value="Italian">Italian</option>
            <option value="Mexican">Mexican</option>
            <option value="Japanese">Japanese</option>
            <option value="Indian">Indian</option>
            <option value="French">French</option></select
          ><br />
          <!-- <div class="box">
            <h3>Most Followed</h3>
            <ul>
              <li>Madalena</li>
              <li>Suzi Perry</li>
              <li>Ally</li>
              <li>Matteo</li>
            </ul>
          </div>

          <div class="box">
            <h3>I’d like to cook...</h3>
            <ul>
              <li>Vegetarian</li>
              <li>Dessert</li>
              <li>Pasta</li>
            </ul>
          </div> -->
        </aside>
      </div>
    </div>
    <div class="createPage">

        <h2>Create Recipe</h2>
      
        <form id="recipeForm">
      
          <input type="text" id="recipeName" placeholder="Recipe Name" required>
      
          <select id="recipeCategory" required>
            <option value="">Select Category</option>
            <option value="starter">Starter</option>
            <option value="main">Main Course</option>
            <option value="dessert">Dessert</option>
          </select>
      
          <select id="recipeCuisine" required>
            <option value="">Select Cuisine</option>
            <option value="Italian">Italian</option>
            <option value="Mexican">Mexican</option>
            <option value="Japanese">Japanese</option>
            <option value="Indian">Indian</option>
            <option value="French">French</option>
          </select>
      
          <input
            type="text"
            id="recipeCookTime"
            placeholder="Cook Time"
            required
          >
      
          <input
            type="number"
            id="recipeCalories"
            placeholder="Calories"
            required
          >
      
          <input
            type="text"
            id="recipeImage"
            placeholder="Image Path (images/example.jpg)"
            required
          >
      
          <textarea
            id="recipeDescription"
            placeholder="Recipe Description"
            rows="4"
            required
          ></textarea>
      
          <textarea
            id="recipeSteps"
            placeholder="Enter steps separated by commas"
            rows="5"
            required
          ></textarea>
      
          <div class="form-buttons">
            <button type="submit" class="submit-btn">
              Create Recipe
            </button>
      
            <button
              type="button"
              class="cancel-btn"
              onclick="createPage()"
            >
              Cancel
            </button>
          </div>
      
        </form>
      
      </div>
    <script src="script.js"></script>
  </body>
</html>
